services:
  github-activity-intelligence:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_API_KEY: ${APP_API_KEY:-change-me}
      DATABASE_URL: sqlite:////data/github_activity.db
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PAY_TO: ${PAY_TO:-0x9c768177521C9A832B0f8567265ef02E89D0282e}
    volumes:
      - github_activity_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)); assert data['status']=='ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  github_activity_data:
